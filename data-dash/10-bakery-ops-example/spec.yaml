# EXAMPLE DATA: seeded synthetic sales for a fictional bakery. Not real numbers.
dashboard:
  title: Halde & Rye bakery, EXAMPLE DATA
  subtitle: "EXAMPLE DATA for a fictional bakery: when do we sell out of what, and which hours earn the rent?"
  theme: dark
  colors: {accent: "#E0A458", series: ["#E0A458", "#7FB8A4", "#D98BA0"]}
  layout: {sections: tabs}
  locale: en-GB
  display_tz: UTC
  footnote: "EXAMPLE DATA. Every number on this page is synthetic, generated by a seeded script for a bakery that does not exist, to show the dashboard layout. Do not read it as real sales."

sources:
  pos:
    type: snapshot
    path: snapshots/pos_hourly.json
    title: EXAMPLE point-of-sale export (synthetic)
    licence: Example data, not real

datasets:
  - id: sales
    title: Hourly sales by item (EXAMPLE DATA)
    description: Synthetic. One row per item per opening hour with units sold and revenue.
    query: |
      select (day::date + to_hours(hour))::timestamp as hour_start, day::date as day,
             lpad(hour::varchar, 2, '0') || ':00' as hour_label, strftime(day::date, '%a') as weekday,
             item, category, units, revenue_eur
      from pos order by hour_start
    date_column: hour_start
    data_through: "2026-09-17T18:00:00"

filters:
  - {id: category, type: category, field: category, label: Category (example), values: [Bread, Pastry, Cake]}
  - {id: date, type: date_range, label: Day (UTC)}

sections:
  - title: Money
    widgets:
      - {type: kpi, title: Revenue (example), dataset: sales, value: {field: revenue_eur, agg: sum}, format: {type: currency, currency: EUR, decimals: 0}, window: {days: 28}, delta: pct, good: up}
      - {type: kpi, title: Items sold (example), dataset: sales, value: {field: units, agg: sum}, units: items, window: {days: 28}, delta: pct, good: up}
      - {type: kpi, title: Biggest item-hour (example), dataset: sales, value: {field: units, agg: max}, detail_field: item, units: items in one hour, window: {days: 28}, delta: none}
      - {type: stacked_bar, title: Weekly revenue by category (example), dataset: sales, x: hour_start, grain: week, y: {field: revenue_eur, agg: sum}, series: category, series_order: [Bread, Pastry, Cake], format: {type: currency, currency: EUR, decimals: 0}, span: 8, height: 340}
      - {type: bar, title: Revenue by item (example), dataset: sales, x: item, orientation: horizontal, x_plural: items, y: {field: revenue_eur, agg: sum}, format: {type: currency, currency: EUR, decimals: 0}, span: 4, height: 340}
  - title: Rhythm
    widgets:
      - {type: heatmap, title: When customers come (example), subtitle: Items sold by weekday and opening hour, dataset: sales, x: hour_label, x_limit: 16, x_order: ["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"], y: weekday, y_order: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], value: {field: units, agg: sum}, units: items, span: 8}
      - {type: line, title: Weekly items sold (example), dataset: sales, x: hour_start, grain: week, y: {field: units, agg: sum}, series: category, series_order: [Bread, Pastry, Cake], units: items, span: 4, height: 300}
      - type: table
        title: Busiest hours (example)
        dataset: sales
        sort: {field: units, dir: desc}
        limit: 10
        columns:
          - {field: day, label: Day}
          - {field: hour_label, label: Hour}
          - {field: item, label: Item}
          - {field: units, label: Sold, units: items, format: {type: number, decimals: 0}}
          - {field: revenue_eur, label: Revenue, format: {type: currency, currency: EUR, decimals: 2}}
