<!doctype html>
<!-- frame-motion example 08 "PAGE 101": retro teletext on a CRT. 8 s, 1440x1080 (4:3), 120 BPM.
     A fictional teletext service searches for page 101, then builds a mosaic-graphics night sky (2x3 "sixel"
     blocks) row by row and types the listings in. Everything sits on a strict 40x25 character grid drawn on
     one canvas; CRT scanlines are drawn rows, not a blur or glow. Pure seek(t), seeded stars.
     One typeface (VT323, OFL). Black, white + yellow, cyan, red (the teletext set, cut to three).
     All channel names, times and forecasts are FICTIONAL. -->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"VT323";src:url("../fonts/VT323.woff2") format("woff2");}
  html,body{margin:0;width:1440px;height:1080px;overflow:hidden;background:#000}
  #stage{position:absolute;inset:0;width:1440px;height:1080px;overflow:hidden;background:#000}
  canvas{position:absolute;left:0;top:0}
</style></head>
<body><div id="stage"><canvas id="c" width="1440" height="1080"></canvas></div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const BPM=120, SPB=60/BPM, B=n=>n*SPB;
const W='#F2F2F2', Y='#FFE14D', C='#4DE1FF', R='#FF4D4D', K='#000000';
const SX=80, SY=60, SW=1280, SH=960, COLS=40, ROWS=25, CW=SW/COLS, CH=SH/ROWS;
const g=document.getElementById('c').getContext('2d');
// ---- mosaic art: 80 x 33 sixel grid (rows 4..14 of the page), moon + ridge + seeded stars, built once
const AW=80, AH=33, ART=[]; const rnd=mulberry32(101);
for(let y=0;y<AH;y++){ ART.push([]); for(let x=0;x<AW;x++) ART[y].push(0); }
for(let y=0;y<AH;y++) for(let x=0;x<AW;x++){ const dx=(x-60)/1.0, dy=(y-9)*1.5; if(dx*dx+dy*dy<64) ART[y][x]=1; if((x-63)*(x-63)+((y-7)*1.5)*((y-7)*1.5)<40) ART[y][x]=0; }
const ridge=x=>24+4*Math.sin(x*0.11+1)+3*Math.sin(x*0.27)+2*Math.sin(x*0.61+2);
for(let x=0;x<AW;x++) for(let y=Math.round(ridge(x));y<AH;y++) ART[y][x]=2;
for(let k=0;k<46;k++){ const x=Math.floor(rnd()*AW), y=Math.floor(rnd()*18); if(!ART[y][x]) ART[y][x]=3; }
const ARTCOL=[null,W,C,Y];
// ---- page text (row, col, text, colour, double height)
const LINES=[
  [3,1,'SKY TONIGHT',Y,true],
  [16,1,'MOON      RISES 18:42   SETS 07:10',W],
  [17,1,'          WAXING, MOSTLY BRIGHT',C],
  [19,1,'VENUS     LOW IN THE WEST AFTER DUSK',W],
  [21,1,'METEORS   A FEW, BEST AFTER MIDNIGHT',W],
  [23,1,'CLOUD     CLEARING FROM THE WEST',W],
];
const TYPE0=B(5), CPS=90;
let XS=1.7;   // VT323 is narrow: stretch each glyph to fill its teletext cell   // typing starts on b6, characters per second
function cell(col,row,ch,colr,dbl,bg){ const x=SX+col*CW, y=SY+row*CH; if(bg){ g.fillStyle=bg; g.fillRect(x,y,CW*ch.length,CH*(dbl?2:1)); }
  g.fillStyle=colr; for(let i=0;i<ch.length;i++){ if(ch[i]===' ') continue; g.save(); g.translate(x+i*CW+CW*0.06,y); g.scale(XS,dbl?2:1); g.fillText(ch[i],0,CH*0.80); g.restore(); } }
window.seek=function(t){
  g.fillStyle='#0A0A0A'; g.fillRect(0,0,1440,1080);
  g.save(); g.beginPath(); g.roundRect(SX-24,SY-24,SW+48,SH+48,46); g.clip(); g.fillStyle=K; g.fillRect(0,0,1440,1080);
  g.font=`${Math.round(CH*1.05)}px VT323`; g.textBaseline='alphabetic';
  // header: page search 100 -> 101, fictional service name, ticking clock (all a function of t)
  const found=t>=B(1);
  const pg=found?'P101':'P1'+String(Math.floor(t*30)%100).padStart(2,'0');
  const T0=21*3600+59*60+55+Math.floor(t), hh=Math.floor(T0/3600)%24, mm=Math.floor(T0/60)%60, ss=T0%60;
  const clock=[hh,mm,ss].map(v=>String(v).padStart(2,'0')).join(':');
  cell(0,0,pg,found?W:Y,false);
  cell(5,0,'KANAL SJU TEKST',W,false); cell(21,0,'FRI 21 NOV',C,false); cell(32,0,clock,Y,false);
  if(found){
    // title in double height on the found beat
    cell(1,2,'           ',K,false);
    // mosaic graphics build row by row from b2 to b5.5 (each sixel row a step)
    const rowsShown=Math.floor(clamp((t-B(1.25))/(B(3)))*AH);
    for(let y=0;y<rowsShown;y++) for(let x=0;x<AW;x++){ const v=ART[y][x]; if(!v) continue; const bw=CW/2, bh=CH/3;
      const px=SX+x*bw, py=SY+5*CH+y*bh; g.fillStyle=ARTCOL[v]; g.fillRect(Math.round(px)+1,Math.round(py)+1,Math.ceil(bw)-2,Math.ceil(bh)-1); }
    // text rows type in
    let budget=Math.max(0,Math.floor((t-TYPE0)*CPS));
    LINES.forEach(([r,c,s,colr,dbl],li)=>{ if(li===0){ cell(c,r,s,colr,dbl); return; } const n=Math.min(s.length,budget); budget-=s.length; if(n>0) cell(c,r,s.slice(0,n),colr,false); });
    // fastext row on b12: coloured keys
    if(t>=B(12)){ cell(0,24,' NEXT ',K,false,R); cell(7,24,' MOON ',K,false,Y); cell(14,24,' TIDES ',K,false,C); cell(23,24,'ALL FICTIONAL',W,false); }
    // block cursor at the typing head, blinks on half beats until the page is complete
    const total=LINES.slice(1).reduce((a,l)=>a+l[2].length,0), typed=Math.floor((t-TYPE0)*CPS);
    if(t>=TYPE0&&typed<total){ let b2=typed, rr=0, cc=0; for(const [r,c,s] of LINES.slice(1)){ if(b2<=s.length){ rr=r; cc=c+b2; break; } b2-=s.length; }
      g.fillStyle=W; g.fillRect(SX+cc*CW,SY+rr*CH+4,CW,CH-8); }
  }
  // CRT scanlines: one dark row every three pixels, drawn (no blur, no glow)
  g.fillStyle='rgba(0,0,0,0.38)'; for(let y=SY-24;y<SY+SH+24;y+=3) g.fillRect(SX-24,y,SW+48,1);
  g.restore();
};
window.seek(0);
document.fonts.load('40px VT323').then(()=>{window.ready=true;});
</script></body></html>
