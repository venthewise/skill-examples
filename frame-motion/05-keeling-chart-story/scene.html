const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

const local=(t,t0,d)=>clamp((t-t0)/d);

const expoInOut=(p,k=8)=>p<0.5?(1-expoOut(1-2*p,k))/2:(1+expoOut(2*p-1,k))/2;
const springCD=(dt,w=18)=>dt<=0?0:1-Math.exp(-w*dt)*(1+w*dt);

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const line=$('line'), head=$('head'), grid=$('grid'), base=$('base'), vn=$('vn'), yr=$('yr'), m1=$('m1'), m2=$('m2'), src=$('src'), val=$('val');
// views: full record, then the last three years (y range fitted to that window)
const FULL={x0:1957.5,x1:2027.2,y0:300,y1:440};
const last=M.filter(p=>p[0]>M[N-1][0]-3.05); const ZOOM={x0:last[0][0]-0.1,x1:M[N-1][0]+0.25,y0:Math.min(...last.map(p=>p[1]))-2,y1:Math.max(...last.map(p=>p[1]))+2};

function view(t){

const sx=(v,x)=>X0+(x-v.x0)/(v.x1-v.x0)*(X1-X0), sy=(v,y)=>Y0-(y-v.y0)/(v.y1-v.y0)*(Y0-Y1);
function ticks(v,lo,hi,steps,minPx,toPx,horizontal){

  let out='';

    if(a<=0) continue;
    for(let x=Math.ceil(lo/s)*s;x<=hi+1e-9;x+=s){ const key=x.toFixed(3); if(seen.has(key)) continue; seen.add(key); const q=toPx(v,x);

      else { if(q<Y1-1||q>Y0+1) continue; out+=`<line x1="${X0}" x2="${X1}" y1="${q}" y2="${q}" stroke="#121212" stroke-opacity="${0.12*a}" stroke-width="1.5"/><text x="${X1}" y="${q-10}" font-size="22" text-anchor="end" fill="#76766F" fill-opacity="${a}">${Math.round(x)}</text>`; } } }

window.seek=function(t){

  if(n>=1){ const a=M[n-1], b=M[Math.min(N-1,n)]; const x=lerp(a[0],b[0],f), y=lerp(a[1],b[1],f); hx=sx(v,x); hy=sy(v,y); d+=(n>1?'L':'M')+hx.toFixed(1)+' '+hy.toFixed(1); cur=f<0.5?a:b; }
